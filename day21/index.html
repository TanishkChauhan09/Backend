<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrology Website</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h1>Discover Your Zodiac Sign</h1>
            <form id="dobForm">
                <!-- Name and Surname Fields -->
                <div class="input-group">
                    <label for="name">First Name</label>
                    <input type="text" id="name" placeholder="Enter your first name" required>
                </div>
                <div class="input-group">
                    <label for="surname">Surname</label>
                    <input type="text" id="surname" placeholder="Enter your surname" required>
                </div>

                <!-- Date, Month, and Year Fields -->
                <div class="input-group">
                    <label for="date">Date</label>
                    <input type="number" id="date" placeholder="DD" required>
                </div>
                <div class="input-group">
                    <label for="month">Month</label>
                    <input type="number" id="month" placeholder="MM" required>
                </div>
                <div class="input-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" placeholder="YYYY" required>
                </div>

                <button type="submit">Find My Zodiac Sign</button>
            </form>

            <!-- Result Display -->
            <div id="result" class="result"></div>
        </div>
    </div>

    <script src="./first.js"></script>
</body>
</html>

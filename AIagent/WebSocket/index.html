<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
   <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">

    <h1>CHAT APP</h1>
    <input type="text" placeholder="Enter room Number" id="roomNumber">
    <button onclick="joinRoom()" style="margin-top:10px; border-color: black;">Join</button>
    <div id="messageDisplay" style="height: 50vh; width: 50vw; background-color: cornflowerblue; margin-bottom: 20px; margin-top: 20px; border:5px solid red;;"></div>
    <input type="text" placeholder="Type your msg here....." id="message" style="height: 10vh; width: 40vw; font-size: larger; padding-top: 10px;">
    <button onclick="sendMessage()" style="margin-top:10px;border-radius: 5px; ">Send</button>

   </div> 

    <script src="/socket.io/socket.io.js"></script>


    <script>

        const socket = io();
        
        const messageBox = document.getElementById('messageDisplay');
        const messageInput = document.getElementById('message');
        const roomNumber = document.getElementById('roomNumber');
        let roomId = null;

        // function sendMessage(){
        //    const msg = messageInput.value;
        //    socket.emit('message',msg);
        //    const element = document.createElement('div');
        //    element.textContent = msg;
        //    element.style.textAlign = 'right';
        //    messageBox.appendChild(element);
        //    messageInput.value = '';
        // }
    
        
        function sendMessage(){
        const msg = messageInput.value;
        socket.emit('message',{room: roomId, msg});
        const element = document.createElement('div');
        element.textContent = msg;
        element.style.textAlign = 'right';
        element.style.paddingTop = '10px';
        element.style.marginTop = '20px';
        element.style.backgroundColor = '#27DC64';
        element.style.padding = '10px';
        messageBox.appendChild(element);
        messageInput.value = '';
        }


        function joinRoom(){
            const room = roomNumber.value;
            roomId = room;
            socket.emit('join-room',room);
        }

        socket.on('new-message',(data)=>{
        const element = document.createElement('div');
        element.style.textAlign = 'left';
        element.style.backgroundColor = '#F7694F';
        element.style.padding = '10px';
        element.style.marginTop = '20px';
        element.textContent = data;
        messageBox.appendChild(element);
        })

    </script>


</body>
</html>
